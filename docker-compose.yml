name: anveshak

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: anveshak_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding:
    build:
      context: ./embeddingService
      dockerfile: Dockerfile
      args:
        MODEL_NAME: ${MODEL_NAME:-all-MiniLM-L6-v2}
    container_name: embedding_service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    environment:
      MODEL_NAME: ${MODEL_NAME:-all-MiniLM-L6-v2}
      ONNX_CACHE_DIR: /root/.cache/onnx_models
    depends_on:
      postgres:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anveshak_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL}
    depends_on:
      postgres:
        condition: service_started
      embedding:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: anveshak_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:80"
    depends_on:
      - backend
